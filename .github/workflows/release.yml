name: Release

# Cuts a release for every v* tag, or on demand from the Actions tab:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# The release carries the demo application, self-contained for each platform
# (download, extract, run: no .NET to install first), and the control's NuGet
# package. Every platform cross-builds from one Linux runner.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and release, without the leading v (e.g. 1.2.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        # Context values arrive as environment variables rather than being interpolated
        # into the script, so a tag name can never be executed as shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then version="$INPUT_VERSION"; else version="${TAG_NAME#v}"; fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not a valid version (expected 1.2.3 or 1.2.3-beta.1)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish the demo for every platform
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for rid in win-x64 win-x86 win-arm64 osx-x64 osx-arm64 linux-x64 linux-arm64; do
            out="publish/$rid"
            dotnet publish src/SyntaxColorizer.Demo -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:GenerateDocumentationFile=false \
              -p:Version="$VERSION" -o "$out"
            cp README.md LICENSE "$out/"
            name="syntaxcolorizer-demo-$VERSION-$rid"
            case "$rid" in
              win-*) (cd "$out" && zip -qr "../../dist/$name.zip" .) ;;
              *)     tar -czf "dist/$name.tar.gz" -C "$out" . ;;
            esac
          done

      - name: Pack the NuGet package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack src/SyntaxColorizer -c Release -p:Version="$VERSION" -o dist

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          The **SyntaxColorizer demo**, self-contained for each platform: download the archive for
          yours, extract it and run `SyntaxColorizer.Demo`. Nothing else to install.

          To use the control in your own Avalonia app, add the NuGet package
          (`dotnet add package SyntaxColorizer`) or the `.nupkg` attached below.

          On macOS the demo is not signed, so the first launch is blocked: run
          `xattr -d com.apple.quarantine SyntaxColorizer.Demo` once, or allow it under
          System Settings → Privacy & Security. On Linux, `chmod +x SyntaxColorizer.Demo` if the
          executable bit was lost.
          EOF
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" dist/* --clobber
          else
            gh release create "v$VERSION" dist/* --title "SyntaxColorizer $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi
